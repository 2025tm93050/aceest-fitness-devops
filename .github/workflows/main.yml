name: CI/CD Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: aceest-fitness

jobs:
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile (syntax check)
        run: python -m py_compile app.py fitness.py tests/*.py

      - name: Lint with flake8
        run: flake8 . --count --show-source --statistics

  docker-build:
    name: Docker Image Assembly
    runs-on: ubuntu-latest
    needs: build-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test production container
        run: |
          docker run -d --name app -p 5000:5000 "$IMAGE_NAME:$GITHUB_SHA"
          for i in $(seq 1 15); do
            if curl -fs http://localhost:5000/health; then echo; break; fi
            sleep 2
          done
          curl -fs http://localhost:5000/health
          echo "Container runs as: $(docker exec app whoami)"
          docker images "$IMAGE_NAME"

      - name: Show container logs
        if: always()
        run: docker logs app || true

  test:
    name: Automated Testing (Pytest in container)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          tags: ${{ env.IMAGE_NAME }}:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Pytest inside the container
        run: docker run --rm "$IMAGE_NAME:test" python -m pytest -v -p no:cacheprovider --cov=app --cov=fitness --cov-report=term-missing
